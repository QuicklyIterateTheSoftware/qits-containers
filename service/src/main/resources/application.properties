# The application config for qits-containers as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and holds the app's own
# settings. The library jars ship their defaults at ordinal 100 in
# META-INF/microprofile-config.properties — `core` its datasource, persistence unit and Flyway
# lineage; qits-eventstream its bus url, outbox datasource and retry budget. Anything restated here
# is restated because THIS service owns the decision, not because a default was wrong. A deployment
# still overrides any of it by env.

quarkus.application.name=qits-containers

# The prefix every HTTP route of this service lives under: /<segment>/api, where the segment is the
# service name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /containers/*
# reaches this service with the path untouched — so the service itself has to serve /containers/...,
# and there is no unprefixed form. It holds for service-to-service calls on qits-net too: they do
# not pass through the gateway but they address the same paths.
quarkus.rest.path=/containers/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway. Health lives here: /containers/q/health/ready.
quarkus.http.non-application-root-path=/containers/q

# --- the API document ---------------------------------------------------------------------------
# Served at /containers/q/openapi, browsable at /containers/q/swagger-ui — both follow the
# non-application root above (quarkus.swagger-ui.path is relative by default, so it moves along; do
# not pin it). always-include because swagger-ui is a dev-mode-only extension by default, and the
# point of packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-containers API
quarkus.swagger-ui.always-include=true

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-containers` rather than qits-containers-service-<version>-runner, so
# `-Dnative` produces target/qits-containers and the process is identifiable in `ps` / `docker top`.
# The name is spelled TWICE: here, and as failsafe's native.image.path in service/pom.xml. If the
# two drift, the native IT launches nothing and passes.
#
# NOTE THE `jar.` IN THE SECOND KEY, which reads wrong and is right: on Quarkus 3.34.6 the NATIVE
# image's file name goes through `jar().addRunnerSuffix() ? runnerSuffix() : ""`, so this
# jar-scoped boolean drops the suffix from the binary too.
quarkus.package.output-name=qits-containers
quarkus.package.jar.add-runner-suffix=false

# --- the platform event bus -----------------------------------------------------------------------
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately: qits.events.url, the outbox's own datasource
# (QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD) and Flyway lineage, the publish timeout and
# the retry budget all ship as defaults in that jar at ordinal 100. A copy here would be a second
# place to change and a silent way for the two to drift.
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark is one whose first deployment discovers it was never wired up — and the deployable owns where
# it is real. A clone-alone `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side.
# Dark is not absent: the datasource still opens and Flyway still migrates, which is why the suite
# owes the outbox a database of its own.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- telemetry ------------------------------------------------------------------------------------
# One key names the receiver: scheme, host and port, NO path. The ingest path is qits-observability's
# own and belongs to the service, so it is spelled once and derived rather than configured.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is an HTTP resource, and the exporter appends
# /v1/<signal> to this base.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default.
#
# THE THREE LOG KEYS ARE SPELLED OUT ON PURPOSE, although two of them are Quarkus' own defaults.
# Quarkus still labels its OpenTelemetry logging integration PREVIEW, and the whole of what ships
# application logs to qits-observability is the handler `handler.enabled` turns on — so an upgrade
# that changed a default would stop this service's logging with a green build and no error anywhere.
# Written down, a change of default is a diff rather than a silence. Measured against Quarkus
# 3.34.6: handler.enabled defaults true, exporter defaults cdi, level defaults ALL.
#
# The level is the one line here that is not the shipped default: it makes INFO the outbound floor,
# so what leaves the process is a deliberate amount rather than whatever a debug category emits.
# Console logging is untouched — the OTel handler is an ADDITIONAL copy, never the only one, which
# is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
