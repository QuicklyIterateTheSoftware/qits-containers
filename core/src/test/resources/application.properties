# TEST-ONLY OVERRIDES for the `core` module's own suite. Nothing else belongs in this file.
#
# This module is a LIBRARY, so it ships no application.properties at all — its defaults are
# META-INF/microprofile-config.properties at ordinal 100, and they are already in effect here
# because target/classes is on the test classpath. Never restate one of them: a suite green because
# the TEST copy is right proves nothing about the jar a deployable actually gets.

# BOTH datasources run against an EMBEDDED POSTGRES — real binaries, spawned as a child process by
# zonky, never a container. Their ports are chosen at run time, so no url/username/password is
# written here: EmbeddedPgConfigSource supplies six values at an ordinal above this file, one
# database per datasource and both named for THIS module. clean-at-start wipes each schema between
# Quarkus restarts, which is what keeps a suite sharing one database across classes reproducible.
#
# The second lineage is the outbox's, and it needs a database even though the bus is dark below:
# `qits.eventstream.enabled=false` stops publishing, sweeping and dialling, not the datasource.
quarkus.flyway.containers.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true

# THE BUS IS DARK. Darkness belongs to the deployable, and `service` carries the %dev/%test switch
# for the packaged process — but this module is not a deployable and has no such file, so its own
# suite states it here. Nothing in `core` publishes or subscribes; the jar is here for the causation
# persistence trio alone.
qits.eventstream.enabled=false

# NOTHING SWEEPS BEHIND A TEST. The outbox sweeper and the catch-up sweep are the jar's, and a tick
# landing mid-arrangement is how a suite becomes non-deterministic. The startup catch-up needs its
# own key because it is a StartupEvent observer rather than a scheduled job.
quarkus.scheduler.enabled=false
qits.eventstream.catchup-at-startup=false

# NO DEV SERVICES. The first rule here is that a clone tests green with no docker, and a dev service
# is a container start — which is exactly what an unconfigured datasource invites. The config source
# above always gives both of them a url; this line makes "should not ask" into "cannot".
quarkus.devservices.enabled=false

# A FREE port, not Quarkus' default test port 8081. This module registers no route of its own, but
# quarkus-websockets-next arrives with the eventstream jar and brings an HTTP server along, so a
# @QuarkusTest starts one. On the deployment host 8081 is the platform's own npm registry, and
# @QuarkusTest restarts race for it anywhere.
quarkus.http.test-port=0
